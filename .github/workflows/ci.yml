name: CI

on:
  push:
    branches: [main, 'integration/**']
  # DELIBERATELY UNFILTERED — every pull request runs CI, whatever its base.
  #
  # `pull_request.branches` filters on the BASE branch, so the only thing it can
  # do is withhold CI from a PR. That has never been wanted here, and it has now
  # produced the same silent failure twice: with no matching base the workflow
  # does not trigger, only the Snyk check reports, and GitHub shows the PR as
  # CLEAN because nothing required is pending. Lint, type-check, test and smoke
  # never ran, and the PR looks greener than a fully-tested one.
  #
  # First it was task branches merging into `integration/**`, fixed by listing
  # that pattern. Then it was a stacked PR based on `feat/live-activity-push-flag`
  # (#551): `feat/**` was absent, so the same false green returned. Extending the
  # list again would only defer it — a stack based on a `refactor/**` or `fix/**`
  # branch is the next hole, and the failure mode gives no signal that it applied.
  #
  # `push` stays filtered: that one is a real cost control, keeping branch pushes
  # from duplicating the run a PR already performs.
  pull_request:

jobs:
  # Decide whether to skip the heavy CI work. The required status checks
  # (Lint, Test (Node 22), Test (Node 24)) are enforced by branch protection,
  # so the jobs below must ALWAYS run and report success — a job skipped via a
  # job-level `if:` reports "skipped", which does NOT satisfy a required check
  # and would leave the PR un-mergeable forever. Instead each job checks out
  # (cheap, and required so the local composite action exists) and then runs a
  # single guarded `run-ci` step. When the bracketed tag `[skip-ci]` is present
  # in the latest commit message or the PR title, that one step is skipped, the
  # job still succeeds, and the check context goes green in seconds.
  #
  # The PR *body* is deliberately NOT searched. Bracketing alone was assumed to
  # stop prose from tripping the skip; it does not. PR #522 changed cli/index.ts
  # and src/claude-flags.ts, carried no tag in its title or commit, and still
  # skipped every test — its body happened to say "…since it is docs-only and
  # `[skip-ci]`" while describing a *different* PR. All 12 checks reported green
  # in 39 seconds with lint, tests and both smoke jobs skipped, and nothing
  # distinguished that from a real pass. See issue #563.
  #
  # Title-and-commit-only also matches the documented convention: CLAUDE.md says
  # "Put the suffix in the title, not the body."
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          # On pull_request, github.event.head_commit is null, so fall back to
          # the PR title. On push to main, the PR fields are empty and we use
          # the head commit message.
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          haystack="${HEAD_COMMIT_MSG}
          ${PR_TITLE}"
          if printf '%s' "$haystack" | grep -qF -- '[skip-ci]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI skipped::'[skip-ci]' found in commit message / PR title — run-ci step skipped, check reported green."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  setup:
    name: Setup
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/setup
        with:
          node-version: 22

  # Warm the node-24 cache in parallel with `setup` so the matching Test job
  # gets a cache hit and skips npm ci + better-sqlite3 rebuild (~3min → ~40s).
  # Not a required check; node 22 is warmed by `setup` above.
  warm-caches:
    name: Warm cache (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      # Checkout is unguarded and first: the local composite action below only
      # exists on disk after the repo is checked out.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Lint
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          node-version: 22
          command: lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [gate, setup]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          node-version: 22
          command: build

      - if: needs.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Cross-platform coverage (C10). Every other job runs ubuntu-only, yet the
  # repo ships Windows and macOS deploy scripts, has Windows-specific process
  # discovery (wmic/CIM), and depends on node-pty — a native addon whose
  # prebuilds differ per platform. A regression there is invisible to a
  # Linux-only matrix until a user hits it.
  #
  # The job id and both context names — `Smoke (macos-latest)` and
  # `Smoke (windows-latest)` — are REQUIRED CHECKS in ruleset 17561930. A
  # required context that no workflow emits is never reported and never
  # satisfied, so renaming this job makes every PR permanently unmergeable.
  # It has happened once already; see docs/testing/cross-platform-ci.md. The
  # name is now a slight misnomer (it runs the whole suite, not a smoke
  # subset) and that is the cheaper of the two problems.
  #
  # Deliberately NOT reusing the run-ci composite action: its cache key has no
  # OS component, so sharing it would let a Linux node_modules (with Linux
  # node-pty binaries) restore onto Windows. Separate keys, own steps.
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [gate, lint]
    # Not advisory. A Windows or macOS regression makes the PR fail rather
    # than reporting a green check. Evidence and history:
    # docs/testing/cross-platform-ci.md.
    # Per-OS Node pin, and the asymmetry is deliberate and measured.
    #
    # macOS runs 24, the major .nvmrc pins, because libuv tightened AF_UNIX
    # `sun_path` enforcement between 22 and 24: #523's 114-byte socket path
    # raises EINVAL on 24 and binds silently on 22, so only the 24 leg can
    # catch that class. Verified by reintroducing #523 on this branch — five
    # EINVAL failures on macOS while all three ubuntu Test legs stayed green.
    #
    # Windows stays on 22 because 24 kills six vitest fork workers there with
    # "Worker exited unexpectedly" — deterministic, twice out of twice, on
    # runs 011122a and 72a6272, and unrelated to any test assertion (0 failed,
    # 6 unhandled errors). Almost certainly a native addon under Node 24's
    # Windows ABI. Since `Smoke (windows-latest)` is a required check, pinning
    # 22 here is what keeps that crash from blocking every PR in the repo.
    #
    # This is not a regression: Windows was never tested on 24. It is a known
    # gap, recorded in docs/testing/cross-platform-ci.md. Raise Windows to 24
    # once the worker crash is understood.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Per-OS, see the matrix comment above. macOS 24 (the major .nvmrc pins),
      # Windows 22. Measured on macos-latest (macOS 26.5.2 / 25F84) on
      # 2026-08-11 by instrumenting the path in CI: an identical 114-byte
      # socket path raises EINVAL under v24.15.0 and binds cleanly under
      # v22.23.1.
      - name: Set up Node
        if: needs.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # --ignore-scripts, then re-run by hand the two scripts that actually
      # matter. Not belt-and-braces: better-sqlite3 v13 declares no `install`
      # script, so npm synthesises `node-gyp rebuild` from its binding.gyp and
      # compiles from source rather than using the prebuild already in the
      # tarball. That needs Visual Studio, which this runner does not have, so
      # any run with scripts enabled fails here. (v12 survived because its
      # explicit `prebuild-install || node-gyp rebuild` overrode the implicit
      # gyp and downloaded a binary instead.)
      #
      # Nothing else needs a compiler — node-pty ships prebuilds too — and the
      # remaining dependency scripts are skippable: esbuild resolves its binary
      # from an optional platform package, and protobufjs's postinstall only
      # prints version warnings.
      - name: Install
        if: needs.gate.outputs.skip != 'true'
        run: npm ci --ignore-scripts
        shell: bash

      # --ignore-scripts also skips our own `prepare`, which is what runs
      # patch-package. Without it qrcode-terminal keeps its legacy \033 octal
      # escapes and the tsup build dies with "Legacy octal escape sequences
      # cannot be used in strict mode".
      - name: Apply patches
        if: needs.gate.outputs.skip != 'true'
        run: npx patch-package
        shell: bash

      # Likewise our own `postinstall`, which marks node-pty's spawn-helper
      # executable. Without the bit, posix_spawnp fails and every PTY test dies
      # with no useful error. POSIX only — Windows uses conpty and ships no
      # spawn-helper.
      - name: Mark node-pty spawn-helper executable
        if: needs.gate.outputs.skip != 'true' && runner.os != 'Windows'
        run: chmod +x node_modules/node-pty/prebuilds/*/spawn-helper
        shell: bash

      # The FULL suite, not a subset. This used to run a hand-curated allowlist
      # of eight files, which made "not covered on macOS/Windows" the default
      # for every test written afterwards — an author got no signal they were
      # meant to enrol. #523 shipped a macOS-breaking socket-path overflow
      # through a fully green board that way, and a Windows 8.3 short-path bug
      # in server.test.ts sat undetected for the same reason.
      #
      # What this costs, measured 2026-08-11 and not rounded in our favour:
      # with a COLD node_modules cache, `Warm cache (Node 24)` takes ~208s and
      # owns a ~289s critical path, so these jobs finish inside the slack and
      # add nothing. With a WARM cache the Linux side finishes in ~132s and
      # these jobs become the critical path instead: 145s -> 216s, about +71s.
      # So the honest number is "up to ~70s, often zero", not "free".
      # It is free in money — public repo, so the 10x/2x runner multipliers
      # bill nothing.
      #
      # A test that genuinely cannot run on a platform guards itself in-file
      # with `describe.skipIf(process.platform === …)`, which is visible to
      # whoever writes it, rather than in a central list nobody remembers.
      - name: Tests
        if: needs.gate.outputs.skip != 'true'
        run: npm test
        shell: bash

      # node-pty is the dependency most likely to break per-platform, and a
      # failure here is the one a Linux-only matrix can never catch.
      - name: Verify native addon loads
        if: needs.gate.outputs.skip != 'true'
        run: node -e "require('node-pty'); console.log('node-pty loaded on ' + process.platform)"
        shell: bash

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [gate, lint, setup, warm-caches]
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Test
        if: needs.gate.outputs.skip != 'true'
        uses: ./.github/actions/run-ci
        with:
          node-version: ${{ matrix.node-version }}
          command: test
